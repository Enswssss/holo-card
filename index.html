<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holo Card · 黑标绅士</title>
<style>
  :root {
    --card-w: 380px;
    --card-h: 532px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow-x: clip; }
  body {
    min-height: 100vh;
    background: #fafafa;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 32px 16px;
    gap: 24px;
  }

  .stage {
    width: var(--card-w);
    height: var(--card-h);
    perspective: 1200px;
    position: relative;
  }
  .card {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    transition: transform .08s linear;
    border-radius: 18px;
    cursor: grab;
    will-change: transform;
  }
  .card:active { cursor: grabbing; }

  /* base art */
  .card-art {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    overflow: hidden;
    background: #111;
    box-shadow:
      0 24px 48px rgba(0,0,0,.28),
      0 4px 12px rgba(0,0,0,.18);
  }
  .card-art img.bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: blur(14px) brightness(.55) saturate(1.2);
    transform: scale(1.1);
  }
  .card-art img.fg {
    position: relative;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* holo foil layers */
  .foil, .glare {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    pointer-events: none;
  }
  /* rainbow foil: conic gradient shifted by CSS vars, masked by image luminance-ish via overlay blend */
  .foil {
    background:
      repeating-linear-gradient(115deg,
        hsl(0 90% 60% / .16) 0 12%,
        hsl(60 90% 55% / .16) 12% 24%,
        hsl(120 80% 55% / .16) 24% 36%,
        hsl(180 85% 55% / .16) 36% 48%,
        hsl(240 85% 62% / .16) 48% 60%,
        hsl(300 85% 58% / .16) 60% 72%,
        hsl(360 90% 60% / .16) 72% 84%,
        hsl(60 90% 55% / .16) 84% 100%);
    background-size: 300% 300%;
    background-position: var(--foil-x, 50%) var(--foil-y, 50%);
    mix-blend-mode: color-dodge;
    opacity: .55;
    filter: saturate(1.4);
  }
  /* diagonal streak highlights */
  .glare {
    background:
      linear-gradient(105deg,
        transparent 30%,
        rgba(255,255,255,.06) 42%,
        rgba(255,255,255,.35) 50%,
        rgba(255,255,255,.06) 58%,
        transparent 70%);
    background-size: 250% 250%;
    background-position: var(--glare-x, 50%) var(--glare-y, 50%);
    mix-blend-mode: overlay;
  }

  /* frame */
  .frame {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    pointer-events: none;
    border: 2px solid rgba(255,255,255,.55);
    outline: 1px solid rgba(0,0,0,.5);
    outline-offset: -4px;
  }

  /* sparkles canvas */
  .sparkles {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    pointer-events: none;
  }

  /* name plate */
  .plate {
    position: absolute;
    left: 14px; right: 14px; bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-radius: 10px;
    background: rgba(10,10,12,.72);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.22);
    color: #f5f2e8;
    transform: translateZ(24px);
  }
  .plate .name {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 19px;
    letter-spacing: .12em;
  }
  .plate .name small {
    display: block;
    font-size: 9px;
    letter-spacing: .28em;
    color: #b8b2a2;
    margin-top: 2px;
  }
  .plate .rarity {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 6px;
    background: linear-gradient(120deg, #d4af37, #f5e7a8 40%, #b8860b 80%);
    color: #1a1408;
    letter-spacing: .1em;
    box-shadow: 0 0 12px rgba(212,175,55,.55);
  }
  .top-tag {
    position: absolute;
    top: 14px; left: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    letter-spacing: .3em;
    color: rgba(255,255,255,.85);
    background: rgba(0,0,0,.45);
    padding: 4px 8px;
    border-radius: 5px;
    backdrop-filter: blur(4px);
    transform: translateZ(20px);
  }
  .top-tag.right {
    left: auto; right: 14px;
    background: linear-gradient(120deg, rgba(212,175,55,.85), rgba(245,231,168,.85));
    color: #1a1408;
    font-weight: 700;
  }

  .hint {
    color: #9a9a9a;
    font-size: 12px;
    letter-spacing: .18em;
    text-transform: uppercase;
    font-family: 'JetBrains Mono', monospace;
  }

  @media (max-width: 414px) {
    :root { --card-w: min(88vw, 340px); --card-h: calc(var(--card-w) * 1.4); }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="card" id="card">
    <div class="card-art">
      <img class="bg" src="assets/card.jpg" alt="" draggable="false">
      <img class="fg" src="assets/card.jpg" alt="黑标绅士 NOIR GENTLEMAN" draggable="false">
    </div>
    <div class="foil" id="foil"></div>
    <div class="glare" id="glare"></div>
    <div class="sparkles"><canvas id="spark"></canvas></div>
    <div class="frame"></div>
    <div class="top-tag">HOLO · 2026</div>
    <div class="top-tag right">UR ★★★</div>
    <div class="plate">
      <div class="name">黑标绅士<small>NOIR GENTLEMAN</small></div>
      <div class="rarity">UR</div>
    </div>
  </div>
</div>

<div class="hint">移动指针 / 触摸倾斜 · tilt to reveal foil</div>

<script>
(() => {
  const card  = document.getElementById('card');
  const foil  = document.getElementById('foil');
  const glare = document.getElementById('glare');
  const stage = card.parentElement;

  const MAX = 16;            // max degrees
  let rx = 0, ry = 0, tx = 0, ty = 0;

  function setTilt(px, py) {           // px,py in -1..1
    tx = px; ty = py;
    ry =  px * MAX;
    rx = -py * MAX;
    card.style.transform =
      `rotateX(${rx}deg) rotateY(${ry}deg) scale(1.02)`;
    foil.style.setProperty('--foil-x', (50 + px * 60) + '%');
    foil.style.setProperty('--foil-y', (50 + py * 60) + '%');
    glare.style.setProperty('--glare-x', (50 - px * 80) + '%');
    glare.style.setProperty('--glare-y', (50 - py * 80) + '%');
  }

  stage.addEventListener('pointermove', e => {
    const r = stage.getBoundingClientRect();
    const px = ((e.clientX - r.left) / r.width) * 2 - 1;
    const py = ((e.clientY - r.top) / r.height) * 2 - 1;
    setTilt(px, py);
  });
  stage.addEventListener('pointerleave', () => {
    card.style.transition = 'transform .5s cubic-bezier(.2,.8,.2,1)';
    card.style.transform = 'rotateX(0) rotateY(0) scale(1)';
    setTimeout(() => card.style.transition = 'transform .08s linear', 500);
  });

  // touch tilt (device orientation fallback)
  window.addEventListener('deviceorientation', e => {
    const px = Math.max(-1, Math.min(1, (e.gamma || 0) / 40));
    const py = Math.max(-1, Math.min(1, ((e.beta || 0) - 45) / 40));
    setTilt(px, py);
  });

  // sparkles
  const cv = document.getElementById('spark');
  const ctx = cv.getContext('2d');
  let W, H;
  function resize() {
    const r = cv.parentElement.getBoundingClientRect();
    W = cv.width = r.width; H = cv.height = r.height;
  }
  resize();
  window.addEventListener('resize', resize);

  const stars = Array.from({length: 26}, () => ({
    x: Math.random(), y: Math.random(),
    r: .6 + Math.random() * 1.6,
    p: Math.random() * Math.PI * 2,
    s: .4 + Math.random() * 1.2
  }));

  let t0 = performance.now();
  (function loop(t) {
    const dt = (t - t0) / 1000; t0 = t;
    ctx.clearRect(0, 0, W, H);
    const energy = Math.min(1, Math.hypot(tx, ty) * 1.6);
    for (const s of stars) {
      s.p += dt * s.s * 2;
      const a = (Math.sin(s.p) * .5 + .5) * (.25 + energy * .75);
      const x = s.x * W + tx * 14 * s.s;
      const y = s.y * H + ty * 14 * s.s;
      const g = ctx.createRadialGradient(x, y, 0, x, y, s.r * 4);
      g.addColorStop(0, `rgba(255,255,255,${a})`);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, s.r * 4, 0, Math.PI * 2);
      ctx.fill();
      // cross flare
      ctx.strokeStyle = `rgba(255,255,255,${a * .6})`;
      ctx.lineWidth = .6;
      ctx.beginPath();
      ctx.moveTo(x - s.r * 3, y); ctx.lineTo(x + s.r * 3, y);
      ctx.moveTo(x, y - s.r * 3); ctx.lineTo(x, y + s.r * 3);
      ctx.stroke();
    }
    requestAnimationFrame(loop);
  })(t0);
})();
</script>

</body>
</html>
