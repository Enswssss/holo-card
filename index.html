<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holo Card · 卡厂</title>
<style>
  :root {
    --card-w: 260px;
    --card-h: calc(var(--card-w) * 1.4);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overflow-x: clip; }
  body {
    min-height: 100vh;
    background: #14141a;
    color: #f5f2e8;
    font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 28px 18px 60px;
  }
  header {
    text-align: center;
    margin-bottom: 26px;
  }
  header h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 26px;
    letter-spacing: .2em;
    background: linear-gradient(120deg, #d4af37, #f5e7a8 45%, #d4af37 80%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p {
    color: #8d8a80;
    font-size: 12px;
    letter-spacing: .28em;
    margin-top: 6px;
    font-family: 'JetBrains Mono', monospace;
  }
  .toolbar {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 26px;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-block;
    padding: 10px 22px;
    border-radius: 9px;
    border: 1px solid rgba(212,175,55,.55);
    background: linear-gradient(120deg, rgba(212,175,55,.14), rgba(245,231,168,.1));
    color: #f5e7a8;
    font-size: 14px;
    letter-spacing: .12em;
    cursor: pointer;
    text-decoration: none;
    transition: transform .15s, box-shadow .15s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(212,175,55,.25); }
  .btn.ghost { border-color: rgba(255,255,255,.25); background: rgba(255,255,255,.05); color: #cfcaba; }

  .section-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: .3em;
    color: #8d8a80;
    margin: 22px 4px 14px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(var(--card-w), 1fr));
    gap: 26px;
    max-width: 1200px;
    margin: 0 auto;
    justify-items: center;
  }
  .cell { width: var(--card-w); }

  /* mini card (static thumbnail, light tilt on hover) */
  .mini {
    width: 100%;
    aspect-ratio: 5 / 7;
    border-radius: 14px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    background: #111;
    box-shadow: 0 14px 30px rgba(0,0,0,.45), 0 3px 10px rgba(0,0,0,.3);
    transition: transform .25s cubic-bezier(.2,.8,.2,1), box-shadow .25s;
    border: 1px solid rgba(255,255,255,.28);
  }
  .mini:hover { transform: translateY(-6px) rotateX(6deg) rotateY(-6deg) scale(1.03); box-shadow: 0 24px 44px rgba(0,0,0,.55); }
  .mini img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .mini .m-plate {
    position: absolute; left: 8px; right: 8px; bottom: 8px;
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(10,10,12,.72); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.22);
    padding: 7px 10px; border-radius: 8px;
  }
  .mini .m-name { font-family: Georgia, serif; font-size: 13px; letter-spacing: .1em; }
  .mini .m-name small { display: block; font-size: 7px; letter-spacing: .22em; color: #b8b2a2; }
  .mini .m-rarity {
    font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 5px;
    background: linear-gradient(120deg, #d4af37, #f5e7a8 40%, #b8860b 80%);
    color: #1a1408; letter-spacing: .08em;
  }
  .mini .m-tag {
    position: absolute; top: 8px; left: 8px;
    font-family: 'JetBrains Mono', monospace; font-size: 8px; letter-spacing: .25em;
    color: rgba(255,255,255,.85); background: rgba(0,0,0,.45);
    padding: 3px 7px; border-radius: 4px; backdrop-filter: blur(4px);
  }
  .cell .ops {
    display: flex; justify-content: center; gap: 10px; margin-top: 10px;
  }
  .ops a, .ops button {
    font-size: 11px; color: #b8b2a2; background: none; border: none;
    border-bottom: 1px dashed rgba(255,255,255,.3); cursor: pointer;
    font-family: inherit; letter-spacing: .08em; padding: 2px 0;
  }
  .ops a:hover, .ops button:hover { color: #f5e7a8; }
  .empty {
    color: #6d6a62; font-size: 13px; text-align: center; padding: 30px 0;
    border: 1px dashed rgba(255,255,255,.15); border-radius: 12px;
    grid-column: 1 / -1;
  }

  /* ===== full-screen viewer modal ===== */
  #viewer {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(8,8,12,.92); backdrop-filter: blur(10px);
    display: none;
    flex-direction: column; align-items: center; justify-content: center;
    padding: 24px 16px; gap: 22px;
  }
  #viewer.open { display: flex; }
  #viewer .stage {
    width: min(88vw, 380px);
    aspect-ratio: 5 / 7;
    perspective: 1200px;
    position: relative;
  }
  #viewer .card {
    width: 100%; height: 100%;
    position: relative; transform-style: preserve-3d;
    transition: transform .08s linear;
    border-radius: 18px; cursor: grab; will-change: transform;
  }
  #viewer .card:active { cursor: grabbing; }
  .card-art { position: absolute; inset: 0; border-radius: 18px; overflow: hidden; background: #111;
    box-shadow: 0 24px 48px rgba(0,0,0,.28), 0 4px 12px rgba(0,0,0,.18); }
  .card-art img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    filter: blur(14px) brightness(.55) saturate(1.2); transform: scale(1.1); }
  .card-art img.fg { position: relative; width: 100%; height: 100%; object-fit: contain; display: block; }
  .foil, .glare { position: absolute; inset: 0; border-radius: 18px; pointer-events: none; }
  .foil {
    background: repeating-linear-gradient(115deg,
      hsl(0 90% 60% / .16) 0 12%, hsl(60 90% 55% / .16) 12% 24%,
      hsl(120 80% 55% / .16) 24% 36%, hsl(180 85% 55% / .16) 36% 48%,
      hsl(240 85% 62% / .16) 48% 60%, hsl(300 85% 58% / .16) 60% 72%,
      hsl(360 90% 60% / .16) 72% 84%, hsl(60 90% 55% / .16) 84% 100%);
    background-size: 300% 300%;
    background-position: var(--foil-x, 50%) var(--foil-y, 50%);
    mix-blend-mode: color-dodge; opacity: .55; filter: saturate(1.4);
  }
  .glare {
    background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,.06) 42%,
      rgba(255,255,255,.35) 50%, rgba(255,255,255,.06) 58%, transparent 70%);
    background-size: 250% 250%;
    background-position: var(--glare-x, 50%) var(--glare-y, 50%);
    mix-blend-mode: overlay;
  }
  .sparkles { position: absolute; inset: 0; border-radius: 18px; pointer-events: none; }
  .vframe { position: absolute; inset: 0; border-radius: 18px; pointer-events: none;
    border: 2px solid rgba(255,255,255,.55); outline: 1px solid rgba(0,0,0,.5); outline-offset: -4px; }
  .plate {
    position: absolute; left: 14px; right: 14px; bottom: 14px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; border-radius: 10px;
    background: rgba(10,10,12,.72); backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.22); color: #f5f2e8;
    transform: translateZ(24px);
  }
  .plate .name { font-family: Georgia, 'Times New Roman', serif; font-size: 19px; letter-spacing: .12em; }
  .plate .name small { display: block; font-size: 9px; letter-spacing: .28em; color: #b8b2a2; margin-top: 2px; }
  .plate .rarity { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700;
    padding: 3px 10px; border-radius: 6px;
    background: linear-gradient(120deg, #d4af37, #f5e7a8 40%, #b8860b 80%);
    color: #1a1408; letter-spacing: .1em; box-shadow: 0 0 12px rgba(212,175,55,.55); }
  .top-tag { position: absolute; top: 14px; left: 14px;
    font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .3em;
    color: rgba(255,255,255,.85); background: rgba(0,0,0,.45);
    padding: 4px 8px; border-radius: 5px; backdrop-filter: blur(4px); transform: translateZ(20px); }
  .top-tag.right { left: auto; right: 14px;
    background: linear-gradient(120deg, rgba(212,175,55,.85), rgba(245,231,168,.85));
    color: #1a1408; font-weight: 700; }
  .hint { color: #9a9a9a; font-size: 12px; letter-spacing: .18em;
    text-transform: uppercase; font-family: 'JetBrains Mono', monospace; }
  #viewer .close {
    position: absolute; top: 16px; right: 20px;
    font-size: 26px; color: #cfcaba; cursor: pointer; background: none; border: none;
  }
  #viewer .vops { display: flex; gap: 14px; }
  #gyroBtn { display: none; }
</style>
</head>
<body>

<header>
  <h1>HOLO 卡厂</h1>
  <p>HOLO CARD FACTORY · 2026</p>
</header>

<div class="toolbar">
  <a class="btn" href="create.html">✦ 创建我的卡</a>
  <a class="btn ghost" href="https://enswssss.github.io/jiangshan-atlas-app/" target="_blank" rel="noopener">江山时序 ↗</a>
</div>

<div class="section-title">馆藏 · BUILT-IN</div>
<div class="grid" id="grid-builtin"></div>

<div class="section-title">我的卡库 · 存在本机浏览器</div>
<div class="grid" id="grid-mine"></div>

<!-- full-screen holographic viewer -->
<div id="viewer">
  <button class="close" onclick="closeViewer()">✕</button>
  <div class="stage">
    <div class="card" id="card">
      <div class="card-art">
        <img class="bg" id="v-bg" alt="" draggable="false">
        <img class="fg" id="v-fg" alt="" draggable="false">
      </div>
      <div class="foil" id="foil"></div>
      <div class="glare" id="glare"></div>
      <div class="sparkles"><canvas id="spark"></canvas></div>
      <div class="vframe"></div>
      <div class="top-tag" id="v-series">HOLO · 2026</div>
      <div class="top-tag right" id="v-stars">UR ★★★</div>
      <div class="plate">
        <div class="name"><span id="v-name">—</span><small id="v-name-en">—</small></div>
        <div class="rarity" id="v-rarity">UR</div>
      </div>
    </div>
  </div>
  <div class="hint">移动指针 / 触摸倾斜 · tilt to reveal foil</div>
  <div class="vops">
    <button class="btn ghost" id="gyroBtn" onclick="enableGyro()">启用陀螺仪</button>
    <button class="btn ghost" id="v-export" style="display:none">导出此卡 HTML</button>
  </div>
</div>

<script>
/* ===== card data ===== */
const BUILTIN = {
  id: 'noir-gentleman', builtin: true,
  name_zh: '黑标绅士', name_en: 'NOIR GENTLEMAN',
  rarity: 'UR', series: 'HOLO · 2026',
  img: 'assets/card.jpg',
  foil: .55, particles: 26, tilt_max_deg: 16, glare: true
};
const LS_KEY = 'holo_cards_v1';
function loadMine() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); }
  catch { return []; }
}
function saveMine(list) { localStorage.setItem(LS_KEY, JSON.stringify(list)); }
const RARITY_STARS = { N: '★', R: '★★', SR: '★★★', SSR: '★★★★', UR: '★★★★★' };

function miniCell(c, opsHtml) {
  return `<div class="cell">
    <div class="mini" onclick="openViewer('${c.id}')">
      <img src="${c.img}" alt="" draggable="false">
      <div class="m-tag">${c.series}</div>
      <div class="m-plate">
        <div class="m-name">${c.name_zh}<small>${c.name_en}</small></div>
        <div class="m-rarity">${c.rarity}</div>
      </div>
    </div>
    ${opsHtml ? `<div class="ops">${opsHtml}</div>` : ''}
  </div>`;
}

function renderGrids() {
  document.getElementById('grid-builtin').innerHTML = miniCell(BUILTIN, '');
  const mine = loadMine();
  document.getElementById('grid-mine').innerHTML = mine.length
    ? mine.map(c => miniCell(c,
        `<a href="javascript:void 0" onclick="openViewer('${c.id}')">查看全息</a>` +
        `<a href="javascript:void 0" onclick="exportCard('${c.id}')">导出HTML</a>` +
        `<button onclick="removeCard('${c.id}')">删除</button>`)).join('')
    : `<div class="empty">还没有自己的卡 —— 点上方「✦ 创建我的卡」做一张，30 秒搞定</div>`;
}

function allCards() { return [BUILTIN, ...loadMine()]; }
function findCard(id) { return allCards().find(c => c.id === id); }

function removeCard(id) {
  if (!confirm('删除这张卡？')) return;
  saveMine(loadMine().filter(c => c.id !== id));
  renderGrids();
}

/* ===== full-screen holographic viewer (effects preserved from v1) ===== */
const viewer = document.getElementById('viewer');
const card   = document.getElementById('card');
const foil   = document.getElementById('foil');
const glare  = document.getElementById('glare');
const stage  = card.parentElement;
const MAXDEF = 16;
let curMax = MAXDEF, rx = 0, ry = 0, tx = 0, ty = 0;

function setTilt(px, py) {
  tx = px; ty = py;
  ry =  px * curMax;
  rx = -py * curMax;
  card.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) scale(1.02)`;
  foil.style.setProperty('--foil-x', (50 + px * 60) + '%');
  foil.style.setProperty('--foil-y', (50 + py * 60) + '%');
  glare.style.setProperty('--glare-x', (50 - px * 80) + '%');
  glare.style.setProperty('--glare-y', (50 - py * 80) + '%');
}
stage.addEventListener('pointermove', e => {
  const r = stage.getBoundingClientRect();
  setTilt(((e.clientX - r.left) / r.width) * 2 - 1, ((e.clientY - r.top) / r.height) * 2 - 1);
});
stage.addEventListener('pointerleave', () => {
  card.style.transition = 'transform .5s cubic-bezier(.2,.8,.2,1)';
  card.style.transform = 'rotateX(0) rotateY(0) scale(1)';
  setTimeout(() => card.style.transition = 'transform .08s linear', 500);
});

let gyroOn = false;
function enableGyro() {
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission().then(s => {
      if (s === 'granted') { gyroOn = true; document.getElementById('gyroBtn').style.display = 'none'; }
    }).catch(() => {});
  } else gyroOn = true;
}
window.addEventListener('deviceorientation', e => {
  if (!gyroOn && 'ontouchstart' in window) return;
  const px = Math.max(-1, Math.min(1, (e.gamma || 0) / 40));
  const py = Math.max(-1, Math.min(1, ((e.beta || 0) - 45) / 40));
  setTilt(px, py);
});

function openViewer(id) {
  const c = findCard(id); if (!c) return;
  curMax = c.tilt_max_deg || MAXDEF;
  document.getElementById('v-bg').src = c.img;
  document.getElementById('v-fg').src = c.img;
  document.getElementById('v-fg').alt = c.name_zh + ' ' + c.name_en;
  document.getElementById('v-name').textContent = c.name_zh;
  document.getElementById('v-name-en').textContent = c.name_en;
  document.getElementById('v-rarity').textContent = c.rarity;
  document.getElementById('v-series').textContent = c.series;
  document.getElementById('v-stars').textContent = c.rarity + ' ' + (RARITY_STARS[c.rarity] || '');
  foil.style.opacity = c.foil ?? .55;
  document.getElementById('v-export').style.display = c.builtin ? 'none' : '';
  document.getElementById('v-export').onclick = () => exportCard(id);
  if ('ontouchstart' in window && typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function' && !gyroOn)
    document.getElementById('gyroBtn').style.display = '';
  viewer.classList.add('open');
  resizeSpark();
}
function closeViewer() { viewer.classList.remove('open'); }
viewer.addEventListener('click', e => { if (e.target === viewer) closeViewer(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeViewer(); });

/* sparkles */
const cv = document.getElementById('spark');
const ctx = cv.getContext('2d');
let W, H;
function resizeSpark() {
  const r = cv.parentElement.getBoundingClientRect();
  W = cv.width = r.width; H = cv.height = r.height;
}
window.addEventListener('resize', resizeSpark);
const stars = Array.from({length: 26}, () => ({
  x: Math.random(), y: Math.random(),
  r: .6 + Math.random() * 1.6,
  p: Math.random() * Math.PI * 2,
  s: .4 + Math.random() * 1.2
}));
let t0 = performance.now();
(function loop(t) {
  const dt = (t - t0) / 1000; t0 = t;
  if (viewer.classList.contains('open')) {
    ctx.clearRect(0, 0, W, H);
    const energy = Math.min(1, Math.hypot(tx, ty) * 1.6);
    for (const s of stars) {
      s.p += dt * s.s * 2;
      const a = (Math.sin(s.p) * .5 + .5) * (.25 + energy * .75);
      const x = s.x * W + tx * 14 * s.s;
      const y = s.y * H + ty * 14 * s.s;
      const g = ctx.createRadialGradient(x, y, 0, x, y, s.r * 4);
      g.addColorStop(0, `rgba(255,255,255,${a})`);
      g.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, s.r * 4, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = `rgba(255,255,255,${a * .6})`; ctx.lineWidth = .6;
      ctx.beginPath();
      ctx.moveTo(x - s.r * 3, y); ctx.lineTo(x + s.r * 3, y);
      ctx.moveTo(x, y - s.r * 3); ctx.lineTo(x, y + s.r * 3);
      ctx.stroke();
    }
  }
  requestAnimationFrame(loop);
})(t0);

/* ===== standalone HTML export (self-contained, offline-viewable) ===== */
function exportCard(id) {
  const c = findCard(id); if (!c || !c.img) return;
  const imgEl = new Image();
  imgEl.onload = () => {
    const cnv = document.createElement('canvas');
    cnv.width = imgEl.naturalWidth; cnv.height = imgEl.naturalHeight;
    cnv.getContext('2d').drawImage(imgEl, 0, 0);
    let b64;
    try { b64 = cnv.toDataURL('image/jpeg', .9); }
    catch { return alert('这张卡的图片无法导出'); }
    const html = buildStandalone(c, b64);
    const blob = new Blob([html], {type: 'text/html'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `holo_${c.name_en || c.id}.html`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  };
  imgEl.src = c.img;
}

function buildStandalone(c, imgB64) {
  return `<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Holo Card · ${c.name_zh}</title>
<style>
  :root { --card-w: min(88vw, 380px); --card-h: calc(var(--card-w) * 1.4); }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { min-height:100vh; background:#14141a; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:22px; padding:24px 16px;
    font-family:'Segoe UI',system-ui,sans-serif; }
  .stage { width:var(--card-w); height:var(--card-h); perspective:1200px; position:relative; }
  .card { width:100%; height:100%; position:relative; transform-style:preserve-3d;
    transition:transform .08s linear; border-radius:18px; cursor:grab; will-change:transform; }
  .card:active { cursor:grabbing; }
  .card-art { position:absolute; inset:0; border-radius:18px; overflow:hidden; background:#111;
    box-shadow:0 24px 48px rgba(0,0,0,.28),0 4px 12px rgba(0,0,0,.18); }
  .card-art img.bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    filter:blur(14px) brightness(.55) saturate(1.2); transform:scale(1.1); }
  .card-art img.fg { position:relative; width:100%; height:100%; object-fit:contain; display:block; }
  .foil,.glare,.sparkles,.vframe { position:absolute; inset:0; border-radius:18px; pointer-events:none; }
  .foil { background:repeating-linear-gradient(115deg,
      hsl(0 90% 60%/.16) 0 12%,hsl(60 90% 55%/.16) 12% 24%,hsl(120 80% 55%/.16) 24% 36%,
      hsl(180 85% 55%/.16) 36% 48%,hsl(240 85% 62%/.16) 48% 60%,hsl(300 85% 58%/.16) 60% 72%,
      hsl(360 90% 60%/.16) 72% 84%,hsl(60 90% 55%/.16) 84% 100%);
    background-size:300% 300%; background-position:var(--foil-x,50%) var(--foil-y,50%);
    mix-blend-mode:color-dodge; opacity:${c.foil ?? .55}; filter:saturate(1.4); }
  .glare { background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.06) 42%,
      rgba(255,255,255,.35) 50%,rgba(255,255,255,.06) 58%,transparent 70%);
    background-size:250% 250%; background-position:var(--glare-x,50%) var(--glare-y,50%);
    mix-blend-mode:overlay; }
  .vframe { border:2px solid rgba(255,255,255,.55); outline:1px solid rgba(0,0,0,.5); outline-offset:-4px; }
  .plate { position:absolute; left:14px; right:14px; bottom:14px; display:flex;
    align-items:center; justify-content:space-between; padding:10px 16px; border-radius:10px;
    background:rgba(10,10,12,.72); backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.22); color:#f5f2e8; transform:translateZ(24px); }
  .plate .name { font-family:Georgia,'Times New Roman',serif; font-size:19px; letter-spacing:.12em; }
  .plate .name small { display:block; font-size:9px; letter-spacing:.28em; color:#b8b2a2; margin-top:2px; }
  .plate .rarity { font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700;
    padding:3px 10px; border-radius:6px;
    background:linear-gradient(120deg,#d4af37,#f5e7a8 40%,#b8860b 80%);
    color:#1a1408; letter-spacing:.1em; box-shadow:0 0 12px rgba(212,175,55,.55); }

</style></head><body>
<div class="stage"><div class="card" id="card">
  <div class="card-art">
    <img class="bg" src="${imgB64}" alt="" draggable="false">
    <img class="fg" src="${imgB64}" alt="" draggable="false">
  </div>
  <div class="foil" id="foil"></div><div class="glare" id="glare"></div>
  <div class="sparkles"><canvas id="spark"></canvas></div>
  <div class="vframe"></div>
  <div class="top-tag">${c.series}</div>
  <div class="top-tag right">${c.rarity} ${(c.rarity==='UR')?'★★★★★':''}</div>
  <div class="plate"><div class="name">${c.name_zh}<small>${c.name_en}</small></div>
    <div class="rarity">${c.rarity}</div></div>
</div></div>
<div class="hint">移动指针 / 触摸倾斜 · tilt to reveal foil</div>
<script>
(() => {
  const card=document.getElementById('card'),foil=document.getElementById('foil'),
        glare=document.getElementById('glare'),stage=card.parentElement,MAX=${c.tilt_max_deg || 16};
  function setTilt(px,py){ry=px*MAX;rx=-py*MAX;
    card.style.transform=\`rotateX(\${rx}deg) rotateY(\${ry}deg) scale(1.02)\`;
    foil.style.setProperty('--foil-x',(50+px*60)+'%');
    foil.style.setProperty('--foil-y',(50+py*60)+'%');
    glare.style.setProperty('--glare-x',(50-px*80)+'%');
    glare.style.setProperty('--glare-y',(50-py*80)+'%');}
  stage.addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect();
    setTilt(((e.clientX-r.left)/r.width)*2-1,((e.clientY-r.top)/r.height)*2-1);});
  stage.addEventListener('pointerleave',()=>{card.style.transition='transform .5s cubic-bezier(.2,.8,.2,1)';
    card.style.transform='rotateX(0) rotateY(0) scale(1)';
    setTimeout(()=>card.style.transition='transform .08s linear',500);});
  window.addEventListener('deviceorientation',e=>{
    const px=Math.max(-1,Math.min(1,(e.gamma||0)/40)),py=Math.max(-1,Math.min(1,((e.beta||0)-45)/40));
    setTilt(px,py);});
  const cv=document.getElementById('spark'),ctx=cv.getContext('2d');let W,H;
  function resize(){const r=cv.parentElement.getBoundingClientRect();W=cv.width=r.width;H=cv.height=r.height;}
  resize();window.addEventListener('resize',resize);
  const stars=Array.from({length:${c.particles || 26}},()=>({x:Math.random(),y:Math.random(),
    r:.6+Math.random()*1.6,p:Math.random()*Math.PI*2,s:.4+Math.random()*1.2}));
  let t0=performance.now(),tx=0,ty=0;
  const _set=setTilt;setTilt=function(px,py){tx=px;ty=py;_set(px,py);};
  (function loop(t){const dt=(t-t0)/1000;t0=t;
    ctx.clearRect(0,0,W,H);
    const energy=Math.min(1,Math.hypot(tx,ty)*1.6);
    for(const s of stars){s.p+=dt*s.s*2;
      const a=(Math.sin(s.p)*.5+.5)*(.25+energy*.75);
      const x=s.x*W+tx*14*s.s,y=s.y*H+ty*14*s.s;
      const g=ctx.createRadialGradient(x,y,0,x,y,s.r*4);
      g.addColorStop(0,\`rgba(255,255,255,\${a})\`);g.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,s.r*4,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=\`rgba(255,255,255,\${a*.6})\`;ctx.lineWidth=.6;
      ctx.beginPath();ctx.moveTo(x-s.r*3,y);ctx.lineTo(x+s.r*3,y);
      ctx.moveTo(x,y-s.r*3);ctx.lineTo(x,y+s.r*3);ctx.stroke();}
    requestAnimationFrame(loop);})(t0);
})();
<\/script>
</body></html>`;
}
